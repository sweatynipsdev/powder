# Fetch forecasts, write the analysis, build the PWA and publish it to GitHub Pages.
# Runs twice a day, on every push to main, and on demand (Actions → Update forecasts → Run).
name: Update forecasts

on:
  schedule:
    # GitHub cron is UTC and ignores daylight saving. These land at 5:20am / 4:20pm PST
    # (6:20am / 5:20pm PDT); off the top of the hour, when GitHub's scheduler is busiest.
    - cron: '20 13 * * *'
    - cron: '20 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_analysis:
        description: Rewrite every analysis even if nothing changed
        type: boolean
        default: false

permissions:
  contents: write # commit logs/usage.csv
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # The live site is the previous run's state: stale fallbacks, change detection, and
      # the data an app-only push reuses.
      PREVIOUS_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A push that changes only the app rebuilds it against the live data: no source fetches
      # and no AI calls, so code pushes don't spend Open-Meteo's daily budget. The diff runs
      # from the commit the live data was built from (data.json `builtFrom`), not just this
      # push, so data-side changes from a cancelled or failed run are never skipped. Scheduled
      # and manual runs, and pushes touching the data side, always do a full update.
      - name: Choose a full update or reuse
        id: mode
        run: |
          mode=full
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            built=$(curl -fsS "${PREVIOUS_DATA_URL}data.json" | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{try{process.stdout.write(JSON.parse(s).builtFrom||"")}catch{}})' || true)
            if [ -n "$built" ] && git fetch --quiet --depth=1 origin "$built" && changed=$(git diff --name-only "$built" "$GITHUB_SHA"); then
              if ! echo "$changed" | grep -qE '^(pipeline/|analysis/|shared/|resorts\.json$|scripts/calibrate\.ts$|\.github/workflows/update\.yml$)'; then
                mode=reuse
              fi
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Update mode: $mode (live data built from ${built:-unknown})"

      # Open-Meteo's free tier is 10,000 weighted calls a day; the two scheduled runs use about
      # half. A push whose full update would take the last 24 hours (or hour) over budget is
      # deferred: nothing below runs, and the next scheduled run deploys it. Scheduled and
      # manual runs never defer. The log is read from main as it is now, not this push's
      # checkout: a scheduled run that finished while this push waited in the queue has
      # committed its row since.
      - name: Check the Open-Meteo budget
        id: budget
        if: github.event_name == 'push' && steps.mode.outputs.mode == 'full'
        run: |
          if ! { git fetch --quiet --depth=1 origin main && git show FETCH_HEAD:logs/openmeteo.csv > "$RUNNER_TEMP/openmeteo.csv"; }; then
            cp logs/openmeteo.csv "$RUNNER_TEMP/openmeteo.csv"
          fi
          npm run --silent om-budget -- "$RUNNER_TEMP/openmeteo.csv"

      # Falls back to a full update if the live data is missing anything.
      - name: Reuse the live data
        id: reuse
        if: steps.mode.outputs.mode == 'reuse'
        continue-on-error: true
        run: npm run reuse-data

      # The local model: learn each mountain's per-model bias from the forecasts and
      # observations logged in history/ (a no-op until enough snow events pile up).
      - name: Learn local model corrections
        if: (steps.mode.outputs.mode == 'full' || steps.reuse.outcome == 'failure') && steps.budget.outputs.defer != 'true'
        run: npm run calibrate

      - name: Fetch and process forecast data
        id: fetch
        if: (steps.mode.outputs.mode == 'full' || steps.reuse.outcome == 'failure') && steps.budget.outputs.defer != 'true'
        run: npm run pipeline
        env:
          POWDER_RECORD_HISTORY: '1'
          POWDER_OM_LOG: logs/openmeteo.csv

      - name: Write the daily analysis
        if: (steps.mode.outputs.mode == 'full' || steps.reuse.outcome == 'failure') && steps.budget.outputs.defer != 'true'
        run: npm run analyze -- ${{ inputs.force_analysis && '--force' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build the app
        if: steps.budget.outputs.defer != 'true'
        run: npm run build

      - if: steps.budget.outputs.defer != 'true'
        uses: actions/configure-pages@v6
      - if: steps.budget.outputs.defer != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        if: steps.budget.outputs.defer != 'true'
        uses: actions/deploy-pages@v5

      # One line per run: a cost history plus the forecast/observation log the local model
      # learns from. The commit also keeps GitHub from switching off this schedule (it does
      # that after 60 days without repository activity). It runs whenever the fetch did, even
      # if the analysis or deploy failed after it, so the budget guard never loses a run's
      # Open-Meteo usage.
      - name: Commit the usage log and forecast history
        if: ${{ !cancelled() && steps.fetch.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/usage.csv logs/openmeteo.csv history/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Usage log and history $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase
          git push
