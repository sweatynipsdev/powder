# Fetch forecasts, write the analysis, build the PWA and publish it to GitHub Pages.
# Runs twice a day, on every push to main, and on demand (Actions → Update forecasts → Run).
name: Update forecasts

on:
  schedule:
    # GitHub cron is UTC and ignores daylight saving. These land at 5:20am / 4:20pm PST
    # (6:20am / 5:20pm PDT); off the top of the hour, when GitHub's scheduler is busiest.
    - cron: '20 13 * * *'
    - cron: '20 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_analysis:
        description: Rewrite every analysis even if nothing changed
        type: boolean
        default: false

permissions:
  contents: write # commit logs/usage.csv
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch and process forecast data
        run: npm run pipeline
        env:
          # The live site is the previous run's state: stale fallbacks and change detection.
          PREVIOUS_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/

      - name: Write the daily analysis
        run: npm run analyze -- ${{ inputs.force_analysis && '--force' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build the app
        run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5

      # One line per run: a cost history, and the commit keeps GitHub from switching off
      # this schedule (it does that after 60 days without repository activity).
      - name: Commit the usage log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/usage.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Usage log $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase
          git push
